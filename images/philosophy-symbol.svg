<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="200" height="200" fill="#f8f9fa"/>
  
  <!-- Outer decorative circle -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="#0052cc" stroke-width="2" opacity="0.15"/>
  
  <!-- Brain in center -->
  <g transform="translate(100, 100)">
    <!-- Left brain hemisphere -->
    <path d="M -8 -18 Q -15 -15 -15 -5 L -15 8 Q -12 14 -5 16 L -2 16 Q -3 10 -5 5 L -5 -8 Q -8 -12 -8 -18" 
          fill="none" stroke="#0052cc" stroke-width="2.5" stroke-linejoin="round"/>
    
    <!-- Right brain hemisphere -->
    <path d="M 8 -18 Q 15 -15 15 -5 L 15 8 Q 12 14 5 16 L 2 16 Q 3 10 5 5 L 5 -8 Q 8 -12 8 -18" 
          fill="none" stroke="#0052cc" stroke-width="2.5" stroke-linejoin="round"/>
    
    <!-- Brain convolutions -->
    <path d="M -6 -5 Q -4 -3 -2 -5" fill="none" stroke="#0052cc" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
    <path d="M 2 -5 Q 4 -3 6 -5" fill="none" stroke="#0052cc" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
    <path d="M -5 2 Q -3 4 -1 2" fill="none" stroke="#0052cc" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
    <path d="M 1 2 Q 3 4 5 2" fill="none" stroke="#0052cc" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
  </g>
  
  <!-- Left side: Suffering (Tears) -->
  <g transform="translate(35, 100)">
    <!-- Tear drop shape -->
    <path d="M 0 -8 Q -5 0 0 10 Q 5 0 0 -8" fill="#0052cc" opacity="0.5"/>
    <!-- Inner highlight -->
    <path d="M -1 -3 Q -2 2 0 6" fill="#ffffff" opacity="0.6"/>
  </g>
  
  <!-- Right side: Joy (Star/Sparkle) -->
  <g transform="translate(165, 100)">
    <!-- 4-pointed star for joy/happiness -->
    <path d="M 0 -10 L 2.5 -3 L 10 -1.5 L 4 3 L 5.5 11 L 0 7 L -5.5 11 L -4 3 L -10 -1.5 L -2.5 -3 Z" 
          fill="#0052cc" opacity="0.6"/>
    <!-- Shine effect -->
    <circle cx="2" cy="-2" r="1.5" fill="#ffffff" opacity="0.8"/>
  </g>
  
  <!-- Connecting line through brain -->
  <line x1="40" y1="100" x2="160" y2="100" stroke="#0052cc" stroke-width="1.5" opacity="0.2" stroke-dasharray="3,2"/>
  
  <!-- Decorative elements -->
  <circle cx="25" cy="70" r="2" fill="#0052cc" opacity="0.3"/>
  <circle cx="175" cy="130" r="2" fill="#0052cc" opacity="0.3"/>
  
  <!-- Labels (subtle) -->
  <text x="35" y="135" font-size="10" fill="#0052cc" opacity="0.5" text-anchor="middle" font-family="Arial, sans-serif" font-weight="500">Suffering</text>
  <text x="165" y="135" font-size="10" fill="#0052cc" opacity="0.5" text-anchor="middle" font-family="Arial, sans-serif" font-weight="500">Joy</text>
</svg>